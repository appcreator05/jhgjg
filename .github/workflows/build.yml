name: Build Web-to-APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application Name'
        required: true
        default: 'My App'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.example.app'
      app_url:
        description: 'Target Website URL'
        required: true
        default: 'https://example.com'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate App Configuration
        run: |
          echo "Building APK for:"
          echo "Name: ${{ github.event.inputs.app_name }}"
          echo "Package: ${{ github.event.inputs.package_name }}"
          echo "URL: ${{ github.event.inputs.app_url }}"
          
          # এখানে আপনি আপনার মূল অ্যান্ড্রয়েড প্রোজেক্টের কনফিগ ফাইল (যেমন strings.xml বা build.gradle) ডাইনামিক্যালি আপডেট করার স্ক্রিপ্ট বা কমান্ড দিতে পারেন।

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: app/build/outputs/apk/release/app-release.apk
