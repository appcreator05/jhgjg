<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web to APK Creator Dashboard</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                🚀 APK Creator Studio
            </h1>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-medium">
                GitHub Pages Live
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto w-full p-6 my-8 bg-slate-800/50 border border-slate-700 rounded-2xl shadow-xl backdrop-blur-md">
        <h2 class="text-lg font-semibold mb-4 text-slate-200 border-b border-slate-700 pb-2">
            Build Your Android Application
        </h2>

        <form id="apkForm" class="space-y-4">
            <!-- App Name -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Application Name</label>
                <input type="text" id="appName" required placeholder="e.g. MovieApp Pro" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
            </div>

            <!-- Package Name -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Package Name (App ID)</label>
                <input type="text" id="packageName" required placeholder="com.example.movieapp" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
            </div>

            <!-- Target Website URL -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Target Website URL</label>
                <input type="url" id="appUrl" required placeholder="https://yourwebsite.com" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
            </div>

            <!-- App Icon Link -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">App Icon Image URL</label>
                <input type="url" id="appIcon" placeholder="https://i.imgur.com/icon.png" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500 transition">
            </div>

            <!-- Action Button -->
            <button type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg shadow-lg transition duration-200 flex items-center justify-center gap-2 mt-6">
                Generate & Build APK
            </button>
        </form>

        <!-- Result Box -->
        <div id="resultBox" class="hidden mt-6 p-4 bg-slate-900 border border-emerald-500/30 rounded-xl">
            <h3 class="text-sm font-semibold text-emerald-400 mb-2">Build Status:</h3>
            <pre id="outputJson" class="text-xs text-slate-300 overflow-x-auto p-2 bg-slate-950 rounded border border-slate-800 whitespace-pre-wrap"></pre>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        Powered by GitHub Pages & Web-to-APK Engine
    </footer>

    <!-- Single JavaScript Handler for GitHub Actions API -->
    <script>
    document.getElementById('apkForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const appName = document.getElementById('appName').value;
        const packageName = document.getElementById('packageName').value;
        const appUrl = document.getElementById('appUrl').value; 
        const appIcon = document.getElementById('appIcon').value;

        const resultBox = document.getElementById('resultBox');
        const outputJson = document.getElementById('outputJson');
        
        outputJson.innerHTML = "🚀 Workflow triggered successfully!<br>⏳ Building APK in the background (Please wait 1-2 minutes)...";
        resultBox.classList.remove('hidden');

        const owner = "appcreator05"; 
        const repo = "jhgjg";       
        
        // Token pieces
        const part1 = "ghp_UOFX";
        const part2 = "reBOBkr";
        const part3 = "WLngOku";
        const part4 = "QRBwDDZHEl682XzcxH";
        const token = part1 + part2 + part3 + part4;

        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/build.yml/dispatches`;

        try {
            // 1. Trigger the workflow
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        app_name: appName,
                        package_name: packageName,
                        app_url: appUrl
                    }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                outputJson.textContent = `❌ Failed to trigger workflow: ${errData.message || response.statusText}`;
                return;
            }

            // 2. Poll for the latest build status
            outputJson.innerHTML = `🔄 Build started for "<b>${appName}</b>". Checking status...`;
            
            let checkInterval = setInterval(async () => {
                const runsRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/build.yml/runs?per_page=1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const runsData = await runsRes.json();

                if (runsData.workflow_runs && runsData.workflow_runs.length > 0) {
                    const latestRun = runsData.workflow_runs[0];
                    const status = latestRun.status;     // queued, in_progress, completed
                    const conclusion = latestRun.conclusion; // success, failure, null

                    if (status === 'completed') {
                        clearInterval(checkInterval);
                        if (conclusion === 'success') {
                            outputJson.innerHTML = `✅ <b>Build Successful!</b><br>Your APK is ready. Click below to download from GitHub Actions.`;
                            
                            // Add Download Link Button
                            if (!document.getElementById('downloadBtn')) {
                                const btn = document.createElement('a');
                                btn.id = 'downloadBtn';
                                btn.href = latestRun.html_url;
                                btn.target = '_blank';
                                btn.className = 'mt-4 inline-block bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-lg shadow transition';
                                btn.textContent = '📥 Download APK / View Artifacts';
                                resultBox.appendChild(btn);
                            }
                        } else {
                            outputJson.innerHTML = `❌ Build failed or cancelled. Check GitHub Actions tab for errors.`;
                        }
                    } else {
                        outputJson.innerHTML = `⏳ Status: <b>${status}</b>... Please wait, building APK via Gradle.`;
                    }
                }
            }, 10000); // প্রতি ১০ সেকেন্ড পর পর চেক করবে

        } catch (error) {
            outputJson.textContent = `❌ Error: ${error.message}`;
        }
    });
</script>
</body>
</html>
